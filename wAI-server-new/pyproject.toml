[project]
name = "wai-server-new"
version = "0.1.0"
description = "Python backend for wAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aio-pika>=9.5.5",
    "bcrypt>=4.2.1",
    "fastapi>=0.115.6",
    "httpx>=0.28.1",
    "motor>=3.6.0",
    "pyjwt>=2.10.1",
    "razorpay==0.2.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
wai-server-new = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
